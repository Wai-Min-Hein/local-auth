<link rel="stylesheet" href="forms.css">

<div class="card">
  <h1>Sign Up</h1>

  <form id="signup-form" novalidate>

    <!-- Display Name -->
    <div class="form-row" data-field="displayName">
      <label class="field-label" for="displayName">Display Name</label>
      <input class="field-input" id="displayName" placeholder="Enter display name">
      <span class="field-error"></span>
    </div>

    <!-- Username -->
    <div class="form-row" data-field="username">
      <label class="field-label" for="username">Email</label>
      <input class="field-input" id="username" placeholder="Enter email">
      <span class="field-error"></span>
    </div>

    <!-- Password -->
    <div class="form-row" data-field="password">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" id="password" type="password" placeholder="Enter password">
      <span class="field-error"></span>
    </div>

    <!-- Confirm Password -->
    <div class="form-row" data-field="confirmPassword">
      <label class="field-label" for="confirmPassword">Confirm Password</label>
      <input class="field-input" id="confirmPassword" type="password" placeholder="Confirm password">
      <span class="field-error"></span>
    </div>

    <button class="submit-btn">Sign Up</button>
  </form>

  <div class="footer">
    Already have an account? <a href="tdn-login.html">Log in</a>
  </div>
</div>

<script src="forms.js"></script>

<script>
function handleSubmit(e) {
  e.preventDefault();

  const fields = ['displayName','username','password','confirmPassword'];
  let valid = true;
  let values = {};

  fields.forEach(f => {
    const input = getInput(f);
    const error = getErrorSpan(f);
    const val = input.value.trim();
    const msg = validateField(f, val);

    if (msg) {
      applyInputState(input,'fail');
      applyErrorState(error,msg);
      valid = false;
    } else {
      applyInputState(input,'success');
      applyErrorState(error,'');
      values[f] = val;
    }
  });

  if (valid) {
    alert(
      `Display Name: ${values.displayName} | Username: ${values.username} | Password: ${values.password}`
    );
  }
}

window.addEventListener('load', () => {
  document.getElementById('signup-form')
    .addEventListener('submit', handleSubmit);
});
</script>
