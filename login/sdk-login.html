<!doctype html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="form.css">
</head>

<body>

<div class="card">
  <h1>Log in</h1>

  <form id="login-form" novalidate>

    <div class="form-row" data-field="username">
      <label class="field-label">Email</label>
      <input id="username" class="field-input" type="text" placeholder="Enter your email">
      <span class="field-error"></span>
    </div>

    <div class="form-row" data-field="password">
      <label class="field-label">Password</label>
      <input id="password" class="field-input" type="password" placeholder="Enter your password">
      <span class="field-error"></span>
    </div>

    <button class="submit-btn" type="submit">Login</button>
  </form>

  <p class="card-footer">
    Don't have an account? <a href="./sdk-signup.html">Sign up</a>
  </p>
</div>

<script src="form.js"></script>

<script>
  const fields = ["username", "password"];

  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();

    blurEnabled = true;
    attachBlur(fields);

    let ok = true;

    fields.forEach(f => {
      if (!validateAndRender(f)) ok = false;
    });

    if (ok) {
      alert("Login success");
    }
  });
</script>

</body>
</html>
