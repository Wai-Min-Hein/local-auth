<!-- ============================================================
  VIEW — CSS
  Defines layout and all visual states.
  JS never writes style="" directly — it only adds/removes
  the state classes defined here.
============================================================ -->
<style>

  /* ── Layout ── */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 24px;
  }

  /* ── Form row ── */
  .form-row {
    margin-bottom: 16px;
  }

  /* ── Label ── */
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }

  /* ── Input (default / normal state) ── */
  .field-input {
    display: block;
    width: 100%;
    padding: 9px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    box-sizing: border-box;
  }

  /* ── Error message (hidden by default) ── */
  .field-error {
    display: block;
    font-size: 12px;
    min-height: 16px;  /* reserve space so layout does not jump */
    margin-top: 5px;
    color: transparent; /* JS adds .fail class to make it visible */
  }

  /* ── Submit button ── */
  .submit-btn {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 8px;
  }

  /* ── Footer link ── */
  .card-footer {
    margin-top: 20px;
    font-size: 13px;
    text-align: center;
    color: #666;
  }

  .card-footer a { color: #111; }

  /* ──────────────────────────────────────────────────────────
     STATE CLASSES
     Applied by JS directly on .field-input and .field-error.
     CSS decides what each state looks like.
  ────────────────────────────────────────────────────────── */

  /* fail: shown when a field fails validation */
  .field-input.fail  { border-color: #e53e3e; background: #fff5f5; }
  .field-error.fail  { color: #e53e3e; }

  /* success: shown when a field passes validation */
  .field-input.success { border-color: #38a169; background: #f0fff4; }

</style>
</head>
<body>

<!-- ============================================================
  MODEL — HTML Elements
  Input elements hold the user data (.value).
  data-field on each .form-row is used by JS to locate
  the row, its input, and its error span in one lookup.
  No inline handlers (onclick, onchange) anywhere in HTML.
============================================================ -->
<div class="card">

  <h1>Log in</h1>

  <form id="login-form" novalidate>

    <div class="form-row" data-field="username">
      <label class="field-label" for="username">Username</label>
      <input class="field-input" id="username" type="text" placeholder="Enter username">
      <span class="field-error"></span>
    </div>

    <div class="form-row" data-field="password">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" id="password" type="password" placeholder="Enter password">
      <span class="field-error"></span>
    </div>

    <button class="submit-btn" type="submit">Log in</button>

  </form>

  <p class="card-footer">
    No account? <a href="signup.html">Sign up</a>
  </p>

</div>

</html>
