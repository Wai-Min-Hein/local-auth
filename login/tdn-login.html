<link rel="stylesheet" href="forms.css">
<div class="card">
<h1>Log in</h1>

<form id="login-form" novalidate>

  <div class="form-row" data-field="username">
    <label class="field-label">Username</label>
    <input class="field-input" id="username">
    <span class="field-error"></span>
  </div>

  <div class="form-row" data-field="password">
    <label class="field-label">Password</label>
    <input class="field-input" id="password" type="password">
    <span class="field-error"></span>
  </div>

  <button class="submit-btn">Log in</button>
</form>

<div class="footer">
  No account? <a href="tdn-signup.html">Sign up</a>
</div>
</div>

<script src="forms.js"></script>

<script>
function handleSubmit(e) {
  e.preventDefault();

  const fields = ['username','password'];
  let valid = true;
  let values = {};

  fields.forEach(f => {
    const input = getInput(f);
    const error = getErrorSpan(f);
    const val = input.value.trim();
    const msg = validateField(f, val);

    if (msg) {
      applyInputState(input,'fail');
      applyErrorState(error,msg);
      valid = false;
    } else {
      applyInputState(input,'success');
      applyErrorState(error,'');
      values[f] = val;
    }
  });

  if (valid) {
    alert(`Username: ${values.username} | Password: ${values.password}`);
  }
}

window.addEventListener('load', () => {
  document.getElementById('login-form')
    .addEventListener('submit', handleSubmit);
});
</script>
