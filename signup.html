<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="forms.css">
</head>
<body>

<section class="card">
  <h1>Create account</h1>

  <form id="signup-form" novalidate>
    <div class="form-row" data-field="displayName">
      <label class="field-label" for="displayName">Display Name</label>
      <input class="field-input" id="displayName" type="text" placeholder="Enter display name">
      <span class="field-error"></span>
    </div>

    <div class="form-row" data-field="username">
      <label class="field-label" for="username">Username</label>
      <input class="field-input" id="username" type="email" placeholder="Enter email">
      <span class="field-error"></span>
    </div>

    <div class="form-row" data-field="password">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" id="password" type="password" placeholder="Create password">
      <span class="field-error"></span>
    </div>

    <button class="submit-btn" type="submit">Sign up</button>
  </form>

  <p class="card-footer">
    Already have an account? <a href="login.html">Log in</a>
  </p>
</section>

<script src="forms.js"></script>
<script src="store.js"></script>
<script>
  var fieldNames = ["displayName", "username", "password"];

  function getFormValues() {
    return collectValues(fieldNames);
  }

  function validateSignupForm() {
    return validateFields(fieldNames);
  }

  function handleSubmit(event) {
    event.preventDefault();
    attachBlurValidation(fieldNames);

    if(!validateSignupForm()) {
      return;
    }

    var values = getFormValues();

    if(findUser(values.username)) {
      setFieldState("username", "Username already taken.");
      return;
    }

    addUser(values.displayName, values.username, values.password);
    window.location.href = "login.html";
  }

  window.addEventListener("load", function() {
    var formElement = document.getElementById("signup-form");
    formElement.addEventListener("submit", handleSubmit);
  });
</script>
</body>
</html>
